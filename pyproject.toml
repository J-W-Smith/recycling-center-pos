[project]
name = "recycling-center-pos"
version = "0.1.0"
description = "Local-first planning scaffold and MVP prototype for a recycling center POS."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

